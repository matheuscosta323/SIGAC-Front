<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enviar Certificado - SIGAC</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="dashboard.css">
    <link rel="stylesheet" href="validacao.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        .form-container{max-width:600px;margin:40px auto;background:white;padding:30px;border-radius:12px;box-shadow:0 10px 25px rgba(0,0,0,.1);}
        .form-container h2{margin-bottom:20px;}
        .form-group{margin-bottom:15px;}
        .form-group label{display:block;margin-bottom:5px;font-weight:600;}
        .form-group input,.form-group select{width:100%;padding:10px;border-radius:8px;border:1px solid #ccc;}
        .btn-submit{width:100%;padding:12px;background:#2563eb;color:white;border:none;border-radius:8px;font-weight:bold;cursor:pointer;}
        .btn-submit:hover{background:#1d4ed8;}
        .btn-submit:disabled{background:#93c5fd;cursor:not-allowed;}
    </style>
</head>
<body class="dashboard-body">
    <main class="content">
        <div class="form-container">
            <h2><i class="fa-solid fa-file-arrow-up"></i> Enviar Certificado</h2>

            <form id="formCertificado">
                <div class="form-group">
                    <label>Título da Atividade</label>
                    <input type="text" id="titulo" required>
                </div>

                <div class="form-group">
                    <label>Curso</label>
                    <select id="selectCurso" required>
                        <option value="">Carregando cursos...</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Tipo de Atividade (Regra)</label>
                    <select id="selectRegra" required>
                        <option value="">Selecione o curso primeiro</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Carga Horária Solicitada (horas)</label>
                    <input type="number" id="cargaHoraria" min="1" required>
                </div>

                <div class="form-group">
                    <label>Arquivo (PDF ou imagem)</label>
                    <input type="file" id="arquivo" accept=".pdf,image/*" required>
                </div>

                <p id="msgUpload" style="display:none;margin-bottom:10px;"></p>

                <button type="submit" class="btn-submit" id="btnEnviar">
                    Enviar Certificado
                </button>
            </form>
        </div>
    </main>

    <script src="main.js"></script>
    <script type="module">
        import { listarCursos, listarRegras, uploadCertificado } from './api.js';

        const selectCurso = document.getElementById('selectCurso');
        const selectRegra = document.getElementById('selectRegra');

        // Carrega cursos
        async function carregarCursos() {
            try {
                const data = await listarCursos();
                selectCurso.innerHTML = '<option value="">Selecione um curso</option>';
                (data.cursos || []).forEach(c => {
                    selectCurso.innerHTML += `<option value="${c.id}">${c.nome}</option>`;
                });
            } catch {
                selectCurso.innerHTML = '<option value="">Erro ao carregar cursos</option>';
            }
        }

        // Carrega regras ao mudar o curso
        selectCurso.addEventListener('change', async () => {
            const cursoId = selectCurso.value;
            selectRegra.innerHTML = '<option value="">Carregando...</option>';
            if (!cursoId) {
                selectRegra.innerHTML = '<option value="">Selecione o curso primeiro</option>';
                return;
            }
            try {
                const data = await listarRegras(cursoId);
                if (!data.regras || data.regras.length === 0) {
                    selectRegra.innerHTML = '<option value="">Nenhuma regra cadastrada para este curso</option>';
                    return;
                }
                selectRegra.innerHTML = '<option value="">Selecione o tipo de atividade</option>';
                data.regras.forEach(r => {
                    selectRegra.innerHTML += `<option value="${r.id}">${r.area} (limite: ${r.limite_horas}h)</option>`;
                });
            } catch {
                selectRegra.innerHTML = '<option value="">Erro ao carregar regras</option>';
            }
        });

        // Submit
        document.getElementById('formCertificado').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnEnviar');
            const msg = document.getElementById('msgUpload');
            const file = document.getElementById('arquivo').files[0];
            btn.disabled = true;
            btn.textContent = 'Enviando...';
            msg.style.display = 'none';

            try {
                await uploadCertificado({
                    titulo: document.getElementById('titulo').value,
                    id_curso: Number(selectCurso.value),
                    id_regra_atividade: Number(selectRegra.value),
                    carga_horaria_solicitada: Number(document.getElementById('cargaHoraria').value)
                }, file);

                msg.style.color = '#16a34a';
                msg.textContent = 'Certificado enviado com sucesso! Aguarde a validação.';
                msg.style.display = 'block';
                e.target.reset();
                selectRegra.innerHTML = '<option value="">Selecione o curso primeiro</option>';
                setTimeout(() => window.location.href = 'validacao.html', 1500);
            } catch (err) {
                msg.style.color = '#dc2626';
                msg.textContent = err.message || 'Erro ao enviar certificado.';
                msg.style.display = 'block';
            } finally {
                btn.disabled = false;
                btn.textContent = 'Enviar Certificado';
            }
        });

        carregarCursos();
    </script>
</body>
</html>
